name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@econav/core
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint --workspaces --if-present
      - run: npm run build --workspace=@econav/web
      - run: npm run test:coverage

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile -t cityconnect-api:ci .
      - name: Build web image
        run: |
          docker build -f Dockerfile.web \
            --build-arg NEXT_PUBLIC_API_URL=https://api.cityconnect.in \
            -t cityconnect-web:ci .
