# Production stack: Postgres + API + worker + web + Caddy (TLS)
# Usage: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

name: cityconnect

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cityconnect_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ALLOW_VERCEL: ${CORS_ALLOW_VERCEL:-false}
      ALLOW_DEMO_OTP: ${ALLOW_DEMO_OTP:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-15}
      RATE_LIMIT_LOGIN_WINDOW_MS: ${RATE_LIMIT_LOGIN_WINDOW_MS:-900000}
      DEFAULT_VEHICLE_SPEED_KMH: ${DEFAULT_VEHICLE_SPEED_KMH:-40}
      DEFAULT_SERVICE_TIME_MINUTES: ${DEFAULT_SERVICE_TIME_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ['/app/scripts/docker/api-entrypoint.sh']
    command: ['node', 'apps/api/dist/worker/notifications.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-15000}
      SKIP_DB_BOOTSTRAP: 'true'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      PUBLIC_WEB_DOMAIN: ${PUBLIC_WEB_DOMAIN}
      PUBLIC_WEB_ALIAS: ${PUBLIC_WEB_ALIAS}
      PUBLIC_API_DOMAIN: ${PUBLIC_API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - internal

volumes:
  cityconnect_pg_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
