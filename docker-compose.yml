services:
  postgres:
    image: postgres:16-alpine
    container_name: cityconnect-postgres
    environment:
      POSTGRES_USER: cityconnect
      POSTGRES_PASSWORD: cityconnect
      POSTGRES_DB: cityconnect
    ports:
      - '5432:5432'
    volumes:
      - cityconnect_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cityconnect -d cityconnect']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cityconnect_pg_data:
